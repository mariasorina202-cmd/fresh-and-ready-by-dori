<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fresh & Ready V7 Control Centre</title><link rel="stylesheet" href="styles.css"><style>
:root{--green:#173b2d;--cream:#f7f1e5;--gold:#b78b48}.admin{max-width:1240px;margin:auto;padding:24px 4vw 80px}.top{position:sticky;top:0;z-index:30;background:rgba(247,241,229,.97);padding:10px 0;border-bottom:1px solid #d9cdbb}.toolbar,.tabs,.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.tabs{margin:18px 0}.tabs button,.btn{border:1px solid #cbbda8;background:#fff;padding:10px 13px;border-radius:10px;font-weight:800}.tabs button.active,.btn.primary{background:var(--green);color:#fff}.btn.gold{background:var(--gold);color:#fff}.btn.danger{color:#8b2424}.panel{background:#fff;padding:20px;margin:14px 0;border:1px solid #ddd1bd;border-radius:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-weight:800;font-size:12px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cfc5b5;border-radius:8px;background:#fff}.field textarea{min-height:90px}.item{border:1px solid #e2d8c8;border-radius:12px;padding:14px;margin:10px 0;background:#fffdf9}.itemHead{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{opacity:.68}.status{font-weight:800}.galleryGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.thumb{border:1px solid #ddd1bd;border-radius:12px;padding:8px}.thumb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}.switch{display:flex;gap:7px;align-items:center}.switch input{width:auto}.warn{background:#fff4d8;border:1px solid #ead19b;padding:12px;border-radius:10px}.heroPrev{width:100%;max-height:260px;object-fit:cover;border-radius:12px}.kpi{font-size:28px;font-weight:900}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpis .panel{margin:0}.small{font-size:12px}@media(max-width:760px){.grid,.kpis{grid-template-columns:1fr}.toolbar .btn{flex:1}.admin{padding-inline:14px}}</style></head><body><main class="admin">
<div class="top"><p class="eyebrow">FRESH & READY BY DORI</p><h1>V7 Control Centre</h1><div class="toolbar"><input id="adminKey" type="password" placeholder="Private admin key" style="padding:12px;border:1px solid #cfc5b5;border-radius:9px;flex:1;min-width:170px"><button class="btn" id="load">Load</button><button class="btn" id="draft">Save Draft</button><button class="btn gold" id="preview">Preview</button><button class="btn primary" id="publish">Publish Live</button></div><p id="status" class="status">Enter your admin key, then tap Load.</p></div><div class="tabs" id="tabs"></div><div id="view"></div>
<script src="site-data.js"></script><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),id=()=>crypto.randomUUID?.()||Date.now().toString(36),clone=x=>JSON.parse(JSON.stringify(x));let d=clone(window.SITE_DATA),tab='Dashboard';const status=$('#status'),view=$('#view');
function migrate(x){x=x||{};x.version=7;x.hero??={image:'',imageKey:'',alt:'Fresh & Ready by Dori',position:'center',overlay:'none'};x.optionGroups??=[];x.builders??=[];if(!x.builders.length&&x.buildYourOwn)x.builders=[{id:'meal',name:'Build Your Own Meal',price:x.buildYourOwn.price||'6.99',description:'',visible:true,steps:[]}];x.deals??=[];x.careers??={enabled:true,talentPool:false,jobs:[]};x.seo??={title:'Fresh & Ready by Dori | Boston',description:'',shareImage:'',instagram:'',facebook:'',tiktok:'',googleMaps:''};x.galleries??={};for(const [k,l] of Object.entries({staff:'Staff',products:'Products',ourStory:'Our Story',premises:'Premises',community:'Community',promotions:'Promotions'}))x.galleries[k]??={label:l,layout:'grid',images:[]};x.sections??=[];if(!x.sections.some(s=>s.id==='careers'))x.sections.splice(Math.max(0,x.sections.findIndex(s=>s.id==='delivery')),0,{id:'careers',label:'Careers',visible:true});x.text??={};Object.assign(x.text,{careersEyebrow:x.text.careersEyebrow||'CAREERS',careersTitle:x.text.careersTitle||'Build brighter days with us.',careersIntro:x.text.careersIntro||'Explore current opportunities at Fresh & Ready by Dori in Boston.'});for(const c of x.menu||[])for(const p of c.products||[]){p.ingredients??='';p.calories??='';p.allergens??=[];p.image??='';p.available??=p.visible!==false;p.featured??=false}return x}
const tabs=['Dashboard','Home','Menu','Builders','Deals','Media','Story & Team','Community','Careers','Sections','Business','Delivery & SEO'];function drawTabs(){$('#tabs').innerHTML=tabs.map(x=>`<button class="${x===tab?'active':''}" onclick="tab='${x}';drawTabs();render()">${x}</button>`).join('')}
function inp(label,val,oninput,area=false,type='text'){return `<div class="field"><label>${esc(label)}</label>${area?`<textarea oninput="${oninput}">${esc(val)}</textarea>`:`<input type="${type}" value="${esc(val)}" oninput="${oninput}">`}</div>`}
function dashboard(){let products=(d.menu||[]).flatMap(c=>c.products||[]),open=(d.careers?.jobs||[]).filter(j=>j.visible&&j.status!=='closed').length;view.innerHTML=`<div class="kpis"><div class="panel"><div class="kpi">${products.length}</div>Products</div><div class="panel"><div class="kpi">${products.filter(p=>p.available===false).length}</div>Sold out</div><div class="panel"><div class="kpi">${open}</div>Open vacancies</div><div class="panel"><div class="kpi">V7</div>CMS version</div></div><div class="panel"><h2>Control Centre</h2><p>Everything visible on the customer website should be manageable here. Use Save Draft → Preview → Publish Live.</p><button class="btn" onclick="loadApplications()">Load job applications</button><div id="apps"></div></div>`}
function home(){view.innerHTML=`<div class="panel"><h2>Hero</h2><div class="grid">${inp('Eyebrow',d.text.heroEyebrow,`d.text.heroEyebrow=this.value`)}${inp('Title',d.text.heroTitle,`d.text.heroTitle=this.value`)}${inp('Lead',d.text.heroLead,`d.text.heroLead=this.value`,true)}${inp('Micro line',d.text.heroMicro,`d.text.heroMicro=this.value`)}${inp('Hero alt text',d.hero.alt,`d.hero.alt=this.value`)}<div class="field"><label>Image position</label><select onchange="d.hero.position=this.value"><option ${d.hero.position==='center'?'selected':''}>center</option><option ${d.hero.position==='left'?'selected':''}>left</option><option ${d.hero.position==='right'?'selected':''}>right</option></select></div></div><p><b>Hero image</b></p><input type="file" accept="image/*" onchange="uploadHero(this.files[0])">${d.hero.image?`<p><img class="heroPrev" src="${esc(d.hero.image)}"></p><button class="btn danger" onclick="d.hero.image='';d.hero.imageKey='';home()">Remove hero image</button>`:'<p class="muted">No hero photo yet — the branded placeholder remains visible.</p>'}</div><div class="panel"><h2>Homepage text</h2><div class="grid">${Object.entries(d.text).filter(([k])=>!['heroEyebrow','heroTitle','heroLead','heroMicro'].includes(k)).map(([k,v])=>inp(k,v,`d.text['${k}']=this.value`,String(v).length>80)).join('')}</div></div>`}
function menu(){view.innerHTML=`<div class="panel"><div class="itemHead"><div><h2>Freestyle Menu</h2><p class="muted">Categories and products are unlimited. Drinks are just another editable category.</p></div><button class="btn primary" onclick="addCat()">+ Category</button></div><div id="cats"></div></div>`;let root=$('#cats');d.menu.forEach((c,ci)=>{let e=document.createElement('div');e.className='item';e.innerHTML=`<div class="itemHead"><h3>${esc(c.name)}</h3><div class="row"><button class="btn" onclick="move(d.menu,${ci},-1,menu)">↑</button><button class="btn" onclick="move(d.menu,${ci},1,menu)">↓</button><button class="btn danger" onclick="delCat(${ci})">Delete</button></div></div><div class="grid">${inp('Category name',c.name,`d.menu[${ci}].name=this.value`)}${inp('Description',c.description||'',`d.menu[${ci}].description=this.value`)}<label class="switch"><input type="checkbox" ${c.visible!==false?'checked':''} onchange="d.menu[${ci}].visible=this.checked"> Visible</label></div>${(c.products||[]).map((p,pi)=>productEditor(p,ci,pi)).join('')}<button class="btn" onclick="addProduct(${ci})">+ Product</button>`;root.append(e)})}
function productEditor(p,ci,pi){return `<div class="item"><div class="itemHead"><b>${esc(p.name)}</b><div class="row"><button class="btn" onclick="move(d.menu[${ci}].products,${pi},-1,menu)">↑</button><button class="btn" onclick="move(d.menu[${ci}].products,${pi},1,menu)">↓</button><button class="btn" onclick="duplicateProduct(${ci},${pi})">Duplicate</button><button class="btn danger" onclick="delProduct(${ci},${pi})">Delete</button></div></div><div class="grid">${inp('Product name',p.name,`d.menu[${ci}].products[${pi}].name=this.value`)}${inp('Price £',p.price,`d.menu[${ci}].products[${pi}].price=this.value`)}${inp('Description',p.description||'',`d.menu[${ci}].products[${pi}].description=this.value`,true)}${inp('Ingredients',p.ingredients||'',`d.menu[${ci}].products[${pi}].ingredients=this.value`,true)}${inp('Calories',p.calories||'',`d.menu[${ci}].products[${pi}].calories=this.value`)}${inp('Allergens — comma separated',(p.allergens||[]).join(', '),`d.menu[${ci}].products[${pi}].allergens=this.value.split(',').map(x=>x.trim()).filter(Boolean)`)}<label class="switch"><input type="checkbox" ${p.visible!==false?'checked':''} onchange="d.menu[${ci}].products[${pi}].visible=this.checked"> Visible</label><label class="switch"><input type="checkbox" ${p.available!==false?'checked':''} onchange="d.menu[${ci}].products[${pi}].available=this.checked"> Available</label><label class="switch"><input type="checkbox" ${p.featured?'checked':''} onchange="d.menu[${ci}].products[${pi}].featured=this.checked"> Featured</label><div class="field"><label>Product photo</label><input type="file" accept="image/*" onchange="uploadProduct(${ci},${pi},this.files[0])">${p.image?`<img class="heroPrev" src="${esc(p.image)}">`:''}</div></div></div>`}
function builders(){view.innerHTML=`<div class="panel"><div class="itemHead"><div><h2>Builders</h2><p class="muted">Build Your Own Meal, Cereal Bowl and future custom products.</p></div><button class="btn primary" onclick="addBuilder()">+ Builder</button></div>${d.builders.map((b,bi)=>`<div class="item"><div class="itemHead"><h3>${esc(b.name)}</h3><button class="btn danger" onclick="d.builders.splice(${bi},1);builders()">Delete</button></div><div class="grid">${inp('Name',b.name,`d.builders[${bi}].name=this.value`)}${inp('Base price £',b.price,`d.builders[${bi}].price=this.value`)}${inp('Description',b.description||'',`d.builders[${bi}].description=this.value`,true)}<label class="switch"><input type="checkbox" ${b.visible!==false?'checked':''} onchange="d.builders[${bi}].visible=this.checked"> Visible</label></div><h4>Steps</h4>${(b.steps||[]).map((s,si)=>`<div class="item"><div class="itemHead"><b>${esc(s.name)}</b><button class="btn danger" onclick="d.builders[${bi}].steps.splice(${si},1);builders()">Delete step</button></div><div class="grid">${inp('Step name',s.name,`d.builders[${bi}].steps[${si}].name=this.value`)}${inp('Minimum choices',s.min??0,`d.builders[${bi}].steps[${si}].min=Number(this.value)`,false,'number')}${inp('Maximum choices',s.max??1,`d.builders[${bi}].steps[${si}].max=Number(this.value)`,false,'number')}</div>${(s.options||[]).map((o,oi)=>`<div class="row item">${inp('Option',o.name,`d.builders[${bi}].steps[${si}].options[${oi}].name=this.value`)}${inp('Extra £',o.price||'0.00',`d.builders[${bi}].steps[${si}].options[${oi}].price=this.value`)}<button class="btn danger" onclick="d.builders[${bi}].steps[${si}].options.splice(${oi},1);builders()">×</button></div>`).join('')}<button class="btn" onclick="d.builders[${bi}].steps[${si}].options.push({name:'New option',price:'0.00'});builders()">+ Option</button></div>`).join('')}<button class="btn" onclick="d.builders[${bi}].steps.push({id:id(),name:'New step',min:0,max:1,options:[]});builders()">+ Step</button></div>`).join('')}</div>`}
function deals(){view.innerHTML=`<div class="panel"><div class="itemHead"><h2>Deals & Promotions</h2><button class="btn primary" onclick="d.deals.push({id:id(),name:'New deal',description:'',price:'0.00',startDate:'',endDate:'',visible:true});deals()">+ Deal</button></div>${d.deals.map((x,i)=>`<div class="item"><div class="itemHead"><h3>${esc(x.name)}</h3><button class="btn danger" onclick="d.deals.splice(${i},1);deals()">Delete</button></div><div class="grid">${inp('Name',x.name,`d.deals[${i}].name=this.value`)}${inp('Price £',x.price,`d.deals[${i}].price=this.value`)}${inp('Description',x.description,`d.deals[${i}].description=this.value`,true)}${inp('Start date',x.startDate||'',`d.deals[${i}].startDate=this.value`,false,'date')}${inp('End date',x.endDate||'',`d.deals[${i}].endDate=this.value`,false,'date')}<label class="switch"><input type="checkbox" ${x.visible!==false?'checked':''} onchange="d.deals[${i}].visible=this.checked"> Active</label></div></div>`).join('')}</div>`}
function media(){view.innerHTML=`<div class="panel"><h2>Media Library</h2><p class="warn">Uploads go to the existing Cloudflare R2 binding <b>MEDIA_BUCKET</b>.</p><div id="gals"></div></div>`;let g=$('#gals');Object.entries(d.galleries).forEach(([k,gal])=>{let e=document.createElement('div');e.className='item';e.innerHTML=`<div class="itemHead"><h3>${esc(gal.label)}</h3><select onchange="d.galleries['${k}'].layout=this.value"><option ${gal.layout==='single'?'selected':''}>single</option><option ${gal.layout==='grid'?'selected':''}>grid</option><option ${gal.layout==='collage'?'selected':''}>collage</option><option ${gal.layout==='slideshow'?'selected':''}>slideshow</option></select></div><input type="file" accept="image/*" multiple onchange="uploadGallery('${k}',this.files)"><div class="galleryGrid">${(gal.images||[]).map((im,i)=>`<div class="thumb"><img src="${esc(im.url)}">${inp('Caption',im.caption||'',`d.galleries['${k}'].images[${i}].caption=this.value`)}<div class="row"><button class="btn" onclick="move(d.galleries['${k}'].images,${i},-1,media)">←</button><button class="btn" onclick="move(d.galleries['${k}'].images,${i},1,media)">→</button><button class="btn danger" onclick="d.galleries['${k}'].images.splice(${i},1);media()">Remove</button></div></div>`).join('')}</div>`;g.append(e)})}
function storyTeam(){view.innerHTML=`<div class="panel"><h2>Our Story</h2>${inp('Story title',d.text.storyTitle,`d.text.storyTitle=this.value`)}${inp('Story body',d.text.storyBody,`d.text.storyBody=this.value`,true)}<p class="muted">Use Media → Our Story for its images.</p></div><div class="panel"><div class="itemHead"><h2>Our Team</h2><button class="btn primary" onclick="d.team.push({id:id(),name:'New team member',role:'',description:'',visible:true});storyTeam()">+ Person</button></div>${d.team.map((t,i)=>`<div class="item"><div class="itemHead"><h3>${esc(t.name)}</h3><button class="btn danger" onclick="d.team.splice(${i},1);storyTeam()">Delete</button></div><div class="grid">${inp('Name',t.name,`d.team[${i}].name=this.value`)}${inp('Role',t.role,`d.team[${i}].role=this.value`)}${inp('Description',t.description,`d.team[${i}].description=this.value`,true)}<label class="switch"><input type="checkbox" ${t.visible!==false?'checked':''} onchange="d.team[${i}].visible=this.checked"> Visible</label></div></div>`).join('')}</div>`}
function community(){view.innerHTML=`<div class="panel"><h2>Community</h2>${d.community.map((x,i)=>`<div class="item grid">${inp('Title',x.title,`d.community[${i}].title=this.value`)}${inp('Text',x.text,`d.community[${i}].text=this.value`,true)}</div>`).join('')}<button class="btn" onclick="d.community.push({title:'New community item',text:''});community()">+ Item</button></div>`}
function careers(){view.innerHTML=`<div class="panel"><div class="itemHead"><div><h2>Careers</h2><p class="muted">Publish a role once, then share its website link on LinkedIn or elsewhere.</p></div><button class="btn primary" onclick="addJob()">+ Vacancy</button></div>${d.careers.jobs.map((j,i)=>`<div class="item"><div class="itemHead"><h3>${esc(j.title)}</h3><button class="btn danger" onclick="d.careers.jobs.splice(${i},1);careers()">Delete</button></div><div class="grid">${inp('Job title',j.title,`d.careers.jobs[${i}].title=this.value`)}${inp('Department',j.department||'',`d.careers.jobs[${i}].department=this.value`)}${inp('Location',j.location||'',`d.careers.jobs[${i}].location=this.value`)}${inp('Employment type',j.employmentType||'',`d.careers.jobs[${i}].employmentType=this.value`)}${inp('Hours',j.hours||'',`d.careers.jobs[${i}].hours=this.value`)}${inp('Pay',j.pay||'',`d.careers.jobs[${i}].pay=this.value`)}${inp('Summary',j.summary||'',`d.careers.jobs[${i}].summary=this.value`,true)}${inp('Responsibilities',j.responsibilities||'',`d.careers.jobs[${i}].responsibilities=this.value`,true)}${inp('Requirements',j.requirements||'',`d.careers.jobs[${i}].requirements=this.value`,true)}${inp('What we offer',j.offer||'',`d.careers.jobs[${i}].offer=this.value`,true)}${inp('Start date',j.startDate||'',`d.careers.jobs[${i}].startDate=this.value`,false,'date')}${inp('Closing date',j.closingDate||'',`d.careers.jobs[${i}].closingDate=this.value`,false,'date')}<div class="field"><label>Status</label><select onchange="d.careers.jobs[${i}].status=this.value"><option ${j.status==='draft'?'selected':''}>draft</option><option ${j.status==='open'?'selected':''}>open</option><option ${j.status==='closing-soon'?'selected':''}>closing-soon</option><option ${j.status==='closed'?'selected':''}>closed</option></select></div><label class="switch"><input type="checkbox" ${j.visible?'checked':''} onchange="d.careers.jobs[${i}].visible=this.checked"> Published on website</label></div><p><b>Share URL after publishing:</b> https://freshandreadybydori.co.uk/careers.html?job=${encodeURIComponent(j.id)}</p></div>`).join('')}</div>`}
function sections(){view.innerHTML=`<div class="panel"><h2>Sections</h2>${d.sections.map((s,i)=>`<div class="item itemHead"><label class="switch"><input type="checkbox" ${s.visible?'checked':''} onchange="d.sections[${i}].visible=this.checked"> <b>${esc(s.label)}</b></label><div><button class="btn" onclick="move(d.sections,${i},-1,sections)">↑</button><button class="btn" onclick="move(d.sections,${i},1,sections)">↓</button></div></div>`).join('')}</div>`}
function business(){view.innerHTML=`<div class="panel"><h2>Business details</h2><div class="grid">${inp('Address line 1',d.business.address1,`d.business.address1=this.value`)}${inp('Address line 2',d.business.address2,`d.business.address2=this.value`)}${inp('Email',d.business.email,`d.business.email=this.value`)}${inp('Phone',d.business.phone||'',`d.business.phone=this.value`)}</div><h3>Opening hours</h3><div class="grid">${Object.entries(d.business.hours).map(([k,v])=>inp(k,v,`d.business.hours['${k}']=this.value`)).join('')}</div></div>`}
function deliverySeo(){let x=d.delivery,s=d.seo;view.innerHTML=`<div class="panel"><h2>Delivery</h2><div class="grid">${inp('Uber Eats label',x.uberLabel,`d.delivery.uberLabel=this.value`)}${inp('Uber Eats URL',x.uberUrl,`d.delivery.uberUrl=this.value`)}<label class="switch"><input type="checkbox" ${x.uberEnabled?'checked':''} onchange="d.delivery.uberEnabled=this.checked"> Uber Eats live</label>${inp('Just Eat label',x.justEatLabel,`d.delivery.justEatLabel=this.value`)}${inp('Just Eat URL',x.justEatUrl,`d.delivery.justEatUrl=this.value`)}<label class="switch"><input type="checkbox" ${x.justEatEnabled?'checked':''} onchange="d.delivery.justEatEnabled=this.checked"> Just Eat live</label></div></div><div class="panel"><h2>SEO & Social</h2><div class="grid">${inp('Site title',s.title,`d.seo.title=this.value`)}${inp('Meta description',s.description,`d.seo.description=this.value`,true)}${inp('Social share image URL',s.shareImage,`d.seo.shareImage=this.value`)}${inp('Instagram URL',s.instagram,`d.seo.instagram=this.value`)}${inp('Facebook URL',s.facebook,`d.seo.facebook=this.value`)}${inp('TikTok URL',s.tiktok,`d.seo.tiktok=this.value`)}${inp('Google Maps URL',s.googleMaps,`d.seo.googleMaps=this.value`)}</div></div>`}
function render(){({Dashboard:dashboard,Home:home,Menu:menu,Builders:builders,Deals:deals,Media:media,'Story & Team':storyTeam,Community:community,Careers:careers,Sections:sections,Business:business,'Delivery & SEO':deliverySeo}[tab]||dashboard)()}
window.move=(a,i,n,fn)=>{let j=i+n;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];fn()};window.addCat=()=>{d.menu.push({id:id(),name:'New category',description:'',visible:true,products:[]});menu()};window.delCat=i=>{if(confirm('Delete category?')){d.menu.splice(i,1);menu()}};window.addProduct=i=>{d.menu[i].products.push({id:id(),name:'New product',description:'',price:'0.00',ingredients:'',calories:'',allergens:[],image:'',available:true,featured:false,visible:true});menu()};window.delProduct=(i,j)=>{if(confirm('Delete product?')){d.menu[i].products.splice(j,1);menu()}};window.duplicateProduct=(i,j)=>{let p=clone(d.menu[i].products[j]);p.id=id();p.name+=' Copy';d.menu[i].products.splice(j+1,0,p);menu()};window.addBuilder=()=>{d.builders.push({id:id(),name:'New Builder',price:'0.00',description:'',visible:true,steps:[]});builders()};window.addJob=()=>{d.careers.jobs.push({id:id(),title:'New Vacancy',department:'',location:'Boston, Lincolnshire',employmentType:'',hours:'',pay:'',summary:'',responsibilities:'',requirements:'',offer:'',startDate:'',closingDate:'',status:'draft',featured:false,visible:false});careers()};
async function upload(file){let key=$('#adminKey').value;if(!file||!key)throw Error('Choose an image and enter the admin key first.');let fd=new FormData();fd.append('file',file);let r=await fetch('/api/images/upload',{method:'POST',headers:{'x-admin-key':key},body:fd}),o=await r.json();if(!r.ok)throw Error(o.error||'Upload failed');return o}window.uploadHero=async f=>{try{status.textContent='Uploading hero…';let o=await upload(f);d.hero.image=o.url;d.hero.imageKey=o.key;status.textContent='Hero uploaded. Save Draft or Publish Live.';home()}catch(e){status.textContent=e.message}};window.uploadProduct=async(i,j,f)=>{try{status.textContent='Uploading product photo…';let o=await upload(f);d.menu[i].products[j].image=o.url;status.textContent='Product photo uploaded.';menu()}catch(e){status.textContent=e.message}};window.uploadGallery=async(k,files)=>{try{for(const f of files){let o=await upload(f);d.galleries[k].images.push({id:id(),url:o.url,key:o.key,caption:''})}status.textContent='Photos uploaded.';media()}catch(e){status.textContent=e.message}};
async function api(action){let key=$('#adminKey').value;if(!key)return status.textContent='Enter your admin key first.';status.textContent=action==='draft'?'Saving draft…':'Publishing…';let r=await fetch('/api/site-data',{method:'POST',headers:{'content-type':'application/json','x-admin-key':key},body:JSON.stringify({action,data:d})}),o=await r.json();status.textContent=r.ok?(action==='draft'?'✓ Draft saved.':'✓ Published live successfully.'):'Error: '+(o.error||r.status)}
window.loadApplications=async()=>{let key=$('#adminKey').value,r=await fetch('/api/careers/applications',{headers:{'x-admin-key':key}}),o=await r.json(),e=$('#apps');e.innerHTML=r.ok?(o.length?o.map(a=>`<div class="item"><b>${esc(a.name)}</b> — ${esc(a.jobId)}<br><span class="small">${esc(a.email)} • ${esc(a.createdAt)}</span><p>${esc(a.message||'')}</p></div>`).join(''):'<p>No applications yet.</p>'):`<p class="warn">${esc(o.error||'Unable to load applications')}</p>`};
$('#load').onclick=async()=>{let key=$('#adminKey').value;if(!key)return status.textContent='Enter your admin key first.';status.textContent='Loading…';let r=await fetch('/api/site-data?mode=draft',{headers:{'x-admin-key':key},cache:'no-store'});if(!r.ok)r=await fetch('/api/site-data',{cache:'no-store'});if(r.ok){d=migrate(await r.json());status.textContent='✓ V7 content loaded.';render()}else status.textContent='No saved content yet — using V7 defaults.'};$('#draft').onclick=()=>api('draft');$('#publish').onclick=()=>api('publish');$('#preview').onclick=()=>{sessionStorage.setItem('fr_preview',JSON.stringify(d));window.open('/?preview=1','_blank')};drawTabs();render();
</script></main></body></html>
