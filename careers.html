<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Careers | Fresh & Ready by Dori</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css"><script src="site-data.js"></script></head><body><header class="nav simple"><a class="brand" href="/">Fresh&Ready <small>by Dori</small></a><a class="navOrder" href="/">BACK TO SITE</a></header><main class="legalPage"><p class="eyebrow">CAREERS</p><div id="job"></div></main><script>(async()=>{let d=window.SITE_DATA;try{let r=await fetch('/api/site-data',{cache:'no-store'});if(r.ok)d=await r.json()}catch{}const th=d.theme||{};const root=document.documentElement;({green:'--green',deep:'--deep',gold:'--gold',silver:'--silver',cream:'--cream',ink:'--ink',white:'--white'});Object.entries({green:'--green',deep:'--deep',gold:'--gold',silver:'--silver',cream:'--cream',ink:'--ink',white:'--white'}).forEach(([k,v])=>{if(th[k])root.style.setProperty(v,th[k])});if(th.backgroundColor)document.body.style.backgroundColor=th.backgroundColor;if(th.backgroundImage){document.body.style.backgroundImage=`url("${String(th.backgroundImage).replace(/"/g,'%22')}")`;document.body.style.backgroundSize=th.backgroundSize||'cover';document.body.style.backgroundPosition=th.backgroundPosition||'center';document.body.style.backgroundAttachment=th.backgroundAttachment||'scroll';}const id=new URLSearchParams(location.search).get('job'),j=(d.careers?.jobs||[]).find(x=>x.id===id&&x.visible===true&&['open','closing-soon'].includes(String(x.status||'').toLowerCase()));const e=document.getElementById('job');if(!j){e.innerHTML='<h1>Careers at Fresh & Ready</h1><p>No published vacancy was found.</p>';return}const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));e.innerHTML=`<h1>${esc(j.title)}</h1><p class="large">${esc([j.location,j.employmentType,j.hours,j.pay].filter(Boolean).join(' • '))}</p><section><h2>About the role</h2><p>${esc(j.summary)}</p></section>${j.responsibilities?`<section><h2>Responsibilities</h2><p>${esc(j.responsibilities).replace(/\n/g,'<br>')}</p></section>`:''}${j.requirements?`<section><h2>What we’re looking for</h2><p>${esc(j.requirements).replace(/\n/g,'<br>')}</p></section>`:''}${j.offer?`<section><h2>What we offer</h2><p>${esc(j.offer).replace(/\n/g,'<br>')}</p></section>`:''}<section><h2>Apply</h2><form id="apply" class="applicationForm"><label>Full name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Phone<input name="phone"></label><label>Right to work in the UK<select name="rightToWork"><option value="">Select</option><option>Yes</option><option>No</option></select></label><label>Availability<textarea name="availability"></textarea></label><label>Earliest start date<input type="date" name="startDate"></label><label>Short message<textarea name="message"></textarea></label><button class="btn primary">Submit application</button><p id="applyStatus"></p></form></section>`;document.getElementById('apply').onsubmit=async ev=>{ev.preventDefault();let o=Object.fromEntries(new FormData(ev.target));o.jobId=j.id;let r=await fetch('/api/careers/apply',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o)}),x=await r.json();document.getElementById('applyStatus').textContent=r.ok?'Application received. Thank you.':(x.error||'Unable to submit application.');if(r.ok)ev.target.reset()}})()</script></body></html>
