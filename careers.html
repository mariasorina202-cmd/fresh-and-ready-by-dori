<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Careers | Fresh & Ready by Dori</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css"><script src="site-data.js"></script></head><body><header class="nav simple"><a class="brand" href="/#careers">Fresh&Ready <small>by Dori</small></a><a class="navOrder" href="/#careers">BACK TO SITE</a></header><main class="legalPage"><p class="eyebrow">CAREERS</p><div id="job"><p>Loading vacancies…</p></div></main><script>
(async()=>{const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let d=window.SITE_DATA||{};try{let r=await fetch('/api/site-data?cb='+Date.now(),{cache:'no-store'});if(r.ok)d=await r.json()}catch(e){}const jobs=(Array.isArray(d?.careers?.jobs)?d.careers.jobs:[]).filter(j=>j&&(j.visible===true||j.visible==='true'||j.published===true)&&['open','closing-soon'].includes(String(j.status||'open').trim().toLowerCase()));const id=new URLSearchParams(location.search).get('job');const e=document.getElementById('job');if(!id){e.innerHTML=`<h1>Build brighter days with us.</h1><p class="large">Explore current opportunities at Fresh & Ready by Dori in Boston.</p><div class="careerGrid">${jobs.length?jobs.map(j=>`<article class="careerCard"><span class="careerStatus">${String(j.status).toLowerCase()==='closing-soon'?'Closing soon':'Open'}</span><p class="eyebrow">${esc(j.department||'CAREERS')}</p><h3>${esc(j.title||'Vacancy')}</h3><p class="careerMeta">${esc([j.location,j.employmentType,j.hours,j.pay].filter(Boolean).join(' • '))}</p><p>${esc(j.summary||'')}</p><a class="textLink" href="careers.html?job=${encodeURIComponent(j.id||'')}">View role & apply →</a></article>`).join(''):'<p>No vacancies are currently published.</p>'}</div>`;return}const j=jobs.find(x=>String(x.id)===String(id));if(!j){e.innerHTML='<h1>Careers at Fresh & Ready</h1><p>No published vacancy was found.</p><p><a href="careers.html">View all vacancies →</a></p>';return}e.innerHTML=`<h1>${esc(j.title)}</h1><p class="large">${esc([j.location,j.employmentType,j.hours,j.pay].filter(Boolean).join(' • '))}</p><section><h2>About the role</h2><p>${esc(j.summary)}</p></section>${j.responsibilities?`<section><h2>Responsibilities</h2><p>${esc(j.responsibilities).replace(/\n/g,'<br>')}</p></section>`:''}${j.requirements?`<section><h2>What we’re looking for</h2><p>${esc(j.requirements).replace(/\n/g,'<br>')}</p></section>`:''}${j.offer?`<section><h2>What we offer</h2><p>${esc(j.offer).replace(/\n/g,'<br>')}</p></section>`:''}<section><h2>Apply</h2><form id="apply" class="applicationForm"><label>Full name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Phone<input name="phone"></label><label>Right to work in the UK<select name="rightToWork"><option value="">Select</option><option>Yes</option><option>No</option></select></label><label>Availability<textarea name="availability"></textarea></label><label>Earliest start date<input type="date" name="startDate"></label><label>Short message<textarea name="message"></textarea></label><button class="btn primary">Submit application</button><p id="applyStatus"></p></form></section>`;document.getElementById('apply').onsubmit=async ev=>{ev.preventDefault();let o=Object.fromEntries(new FormData(ev.target));o.jobId=j.id;let r=await fetch('/api/careers/apply',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o)}),x=await r.json();document.getElementById('applyStatus').textContent=r.ok?'Application received. Thank you.':(x.error||'Unable to submit application.');if(r.ok)ev.target.reset()}})();
</script></body></html>
